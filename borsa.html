<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BIST Hisse Arama</title>
  <meta name="description" content="Borsa İstanbul hisse senetleri arama uygulaması" />

  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BIST" />
  <meta name="theme-color" content="#0a0f1e" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0a0f1e;
      --surface: #111827;
      --surface2: #1a2236;
      --border: rgba(255,255,255,0.07);
      --accent: #e8ff47;
      --accent2: #47c8ff;
      --text: #f0f4ff;
      --text-muted: #6b7a99;
      --red: #ff4757;
      --card-hover: #1e2d47;
      --radius: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      overflow-x: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(72,200,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(72,200,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glow orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.25;
    }
    .orb-1 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #e8ff47 0%, transparent 70%);
      top: -150px; right: -100px;
      animation: drift1 12s ease-in-out infinite;
    }
    .orb-2 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #47c8ff 0%, transparent 70%);
      bottom: 10%; left: -80px;
      animation: drift2 15s ease-in-out infinite;
    }

    @keyframes drift1 {
      0%, 100% { transform: translate(0,0); }
      50% { transform: translate(-30px, 40px); }
    }
    @keyframes drift2 {
      0%, 100% { transform: translate(0,0); }
      50% { transform: translate(20px, -30px); }
    }

    /* App Container */
    .app {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    }

    /* Header */
    .header {
      padding: 20px 20px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(to bottom, var(--bg) 70%, transparent);
      padding-top: max(20px, env(safe-area-inset-top));
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-mark svg {
      width: 22px;
      height: 22px;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .logo-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .logo-sub {
      font-size: 10px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .header-badge {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      background: rgba(232,255,71,0.1);
      border: 1px solid rgba(232,255,71,0.2);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* Search */
    .search-wrap {
      position: relative;
      margin-bottom: 4px;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.2s;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 50px 14px 48px;
      font-size: 16px;
      font-family: 'Syne', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus {
      border-color: rgba(232,255,71,0.4);
      box-shadow: 0 0 0 3px rgba(232,255,71,0.08);
    }
    .search-input:focus + .search-icon { color: var(--accent); }
    .search-wrap:focus-within .search-icon { color: var(--accent); }

    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--surface2);
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s;
      pointer-events: none;
    }

    .clear-btn.visible {
      opacity: 1;
      pointer-events: all;
    }

    .clear-btn:hover { background: var(--card-hover); color: var(--text); }

    /* Filter tabs */
    .filter-bar {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-btn {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .filter-btn:hover { border-color: rgba(232,255,71,0.3); color: var(--text); }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0a0f1e;
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 0;
      margin: 0 20px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .stat {
      flex: 1;
      padding: 10px 12px;
      text-align: center;
      position: relative;
    }

    .stat + .stat::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 1px;
      background: var(--border);
    }

    .stat-val {
      font-family: 'DM Mono', monospace;
      font-size: 16px;
      font-weight: 500;
      color: var(--accent);
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* Results info */
    .results-info {
      padding: 0 20px 10px;
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .results-count {
      color: var(--accent2);
    }

    /* List */
    .list {
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.18s ease;
      position: relative;
      overflow: hidden;
      animation: slideIn 0.3s ease both;
      text-decoration: none;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(232,255,71,0.03) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover, .card:active {
      border-color: rgba(232,255,71,0.25);
      background: var(--card-hover);
      transform: translateY(-1px);
    }

    .card:hover::before { opacity: 1; }

    .card-rank {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      width: 24px;
      text-align: right;
      flex-shrink: 0;
    }

    .card-ticker-wrap {
      flex-shrink: 0;
    }

    .card-ticker {
      display: inline-block;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: #0a0f1e;
      background: var(--accent);
      padding: 4px 9px;
      border-radius: 7px;
      letter-spacing: 0.5px;
      min-width: 58px;
      text-align: center;
    }

    .card-body {
      flex: 1;
      min-width: 0;
    }

    .card-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .card-name mark {
      background: rgba(232,255,71,0.2);
      color: var(--accent);
      border-radius: 3px;
      padding: 0 2px;
    }

    .card-ticker-name mark {
      background: rgba(232,255,71,0.2);
      color: var(--accent);
      border-radius: 3px;
    }

    .card-sector {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 3px;
      font-family: 'DM Mono', monospace;
    }

    .card-arrow {
      color: var(--text-muted);
      flex-shrink: 0;
      transition: transform 0.2s, color 0.2s;
    }

    .card:hover .card-arrow {
      transform: translateX(3px);
      color: var(--accent);
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .empty-text {
      font-size: 14px;
      line-height: 1.5;
    }

    /* Bottom safe area */
    .bottom-pad {
      height: max(24px, env(safe-area-inset-bottom));
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Highlight */
    .highlight { color: var(--accent); }

    /* Sector tag colors */
    .sector-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .sector-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Skeleton loader */
    .skeleton {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .skel-block {
      background: var(--surface2);
      border-radius: 6px;
      animation: shimmer 1.5s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Header sticky blur */
    .header-blur {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(to bottom, var(--bg) 0%, transparent 100%);
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>

</div>

  {id:235,ticker:"YUNSA",name:"Yünsa Yünlü Sanayi Ve Ticaret A.Ş.",sector:"tekstil"},
  {id:236,ticker:"ZEDUR",name:"Zedur Enerji Elektrik Üretim A.Ş.",sector:"enerji"},
  {id:237,ticker:"ZERGY",name:"Zeray Gayrimenkul Yatırım Ortaklığı A.Ş.",sector:"gayrimenkul"},
];

const SECTOR_COLORS = {
  enerji: '#f59e0b',
  teknoloji: '#47c8ff',
  gıda: '#34d399',
  gayrimenkul: '#a78bfa',
  çelik: '#94a3b8',
  çimento: '#fb923c',
  holding: '#e8ff47',
  tekstil: '#f472b6',
  kimya: '#60a5fa',
  savunma: '#f87171',
  sağlık: '#2dd4bf',
  otomotiv: '#facc15',
  metal: '#a3a3a3',
  inşaat: '#c084fc',
  ambalaj: '#86efac',
  finans: '#38bdf8',
  perakende: '#fb7185',
  ulaşım: '#67e8f9',
  madencilik: '#d4a96a',
  makina: '#9ca3af',
  turizm: '#4ade80',
  medya: '#e879f9',
  hizmet: '#cbd5e1',
  ticaret: '#fbbf24',
  diğer: '#6b7280',
};

const SECTOR_LABELS = {
  enerji: 'Enerji', teknoloji: 'Teknoloji', gıda: 'Gıda & İçecek',
  gayrimenkul: 'Gayrimenkul (GYO)', çelik: 'Demir & Çelik',
  çimento: 'Çimento', holding: 'Holding', tekstil: 'Tekstil',
  kimya: 'Kimya', savunma: 'Savunma', sağlık: 'Sağlık',
  otomotiv: 'Otomotiv', metal: 'Metal', inşaat: 'İnşaat',
  ambalaj: 'Ambalaj', finans: 'Finans', perakende: 'Perakende',
  ulaşım: 'Ulaşım & Lojistik', madencilik: 'Madencilik',
  makina: 'Makina', turizm: 'Turizm', medya: 'Medya',
  hizmet: 'Hizmet', ticaret: 'Ticaret', diğer: 'Diğer',
};

// State
let query = '';
let activeFilter = 'all';

// DOM
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const stockList = document.getElementById('stockList');
const filterBar = document.getElementById('filterBar');
const resultsText = document.getElementById('resultsText');
const resultsCount = document.getElementById('resultsCount');
const statShowing = document.getElementById('statShowing');
const statCategory = document.getElementById('statCategory');
const totalBadge = document.getElementById('totalBadge');

function normalize(str) {
  return str.toLowerCase()
    .replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u')
    .replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c')
    .replace(/İ/g,'i').replace(/Ğ/g,'g').replace(/Ü/g,'u')
    .replace(/Ş/g,'s').replace(/Ö/g,'o').replace(/Ç/g,'c');
}

function highlight(text, q) {
  if (!q) return text;
  const norm = normalize(text);
  const normQ = normalize(q);
  const idx = norm.indexOf(normQ);
  if (idx === -1) return text;
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + q.length) + '</mark>' + text.slice(idx + q.length);
}

function getFiltered() {
  let results = STOCKS;
  if (activeFilter !== 'all') {
    results = results.filter(s => s.sector === activeFilter);
  }
  if (query.trim()) {
    const q = normalize(query.trim());
    results = results.filter(s =>
      normalize(s.ticker).startsWith(q) || normalize(s.name).startsWith(q)
    );
  }
  return results;
}

function render() {
  const results = getFiltered();
  const q = query.trim();

  // Update stats
  statShowing.textContent = results.length;
  statCategory.textContent = activeFilter === 'all' ? '—' : (SECTOR_LABELS[activeFilter] || activeFilter);

  // Update info text
  if (q && activeFilter !== 'all') {
    resultsText.textContent = `"${q}" · ${SECTOR_LABELS[activeFilter] || activeFilter}`;
  } else if (q) {
    resultsText.textContent = `"${q}" araması`;
  } else if (activeFilter !== 'all') {
    resultsText.textContent = `${SECTOR_LABELS[activeFilter] || activeFilter} sektörü`;
  } else {
    resultsText.textContent = 'Tüm hisseler listeleniyor';
  }
  resultsCount.textContent = results.length + ' sonuç';

  if (results.length === 0) {
    stockList.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">Sonuç bulunamadı</div>
        <div class="empty-text">Farklı bir arama terimi veya<br/>filtre deneyin.</div>
      </div>
    `;
    return;
  }

  stockList.innerHTML = results.map((s, i) => {
    const color = SECTOR_COLORS[s.sector] || '#6b7280';
    const label = SECTOR_LABELS[s.sector] || s.sector;
    const nameHL = highlight(s.name, q);
    const tickerHL = highlight(s.ticker, q);
    const delay = Math.min(i * 15, 300);
    return `
      <div class="card" style="animation-delay:${delay}ms">
        <span class="card-rank">${s.id}</span>
        <div class="card-ticker-wrap">
          <span class="card-ticker">${tickerHL}</span>
        </div>
        <div class="card-body">
          <div class="card-name">${nameHL}</div>
          <div class="sector-tag">
            <span class="sector-dot" style="background:${color}"></span>
            ${label}
          </div>
        </div>
        <svg class="card-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </div>
    `;
  }).join('');
}

// Sound logic
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSuccessSound() {
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
    
    gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.1);
  } catch (e) {}
}

// Search
searchInput.addEventListener('input', (e) => {
  const oldQuery = query;
  query = e.target.value;
  clearBtn.classList.toggle('visible', query.length > 0);
  render();

  if (query.trim().length > 0 && query !== oldQuery && getFiltered().length === 1) {
    playSuccessSound();
  }
});

clearBtn.addEventListener('click', () => {
  query = '';
  searchInput.value = '';
  clearBtn.classList.remove('visible');
  searchInput.focus();
  render();
});

// Filter
filterBar.addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  render();
});

// Initial render
render();
</script>
</body>
</html>
